<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Map Select - Auto Satellite</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
  <style>
    #map { height: 100vh; }

    /* استایل دکمه‌های ذخیره/انصراف */
    .leaflet-draw-actions a {
      font-size: 18px !important;
      padding: 10px 20px !important;
      font-weight: bold;
      border-radius: 8px;
      margin-left: 5px;
    }

    /* دکمه ذخیره */
    .leaflet-draw-actions li:nth-child(1) a {
      background-color: #28a745 !important; /* سبز */
      color: white !important;
    }

    /* دکمه انصراف */
    .leaflet-draw-actions li:nth-child(2) a {
      background-color: #dc3545 !important; /* قرمز */
      color: white !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    var map = L.map('map').setView([35.7, 51.4], 12);

    // لایه OSM (پیش‌فرض)
    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // لایه ماهواره‌ای Esri
    var esriLayer = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 
      {
        attribution: 'Tiles © Esri',
        maxZoom: 19
      }
    );

    // اضافه کردن سرچ‌باکس
    L.Control.geocoder({ defaultMarkGeocode: true }).addTo(map);

    // پلاگین برای کشیدن محدوده
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    var drawControl = new L.Control.Draw({
      draw: {
        polygon: true,
        rectangle: true,
        circle: false,
        marker: false,
        polyline: false
      },
      edit: {
        featureGroup: drawnItems
      }
    });
    map.addControl(drawControl);

    // تغییر لایه بر اساس zoom level
    map.on("zoomend", function () {
      var zoom = map.getZoom();
      console.log("Zoom:", zoom);

      if (zoom >= 15) { 
        if (!map.hasLayer(esriLayer)) {
          map.removeLayer(osmLayer);
          map.addLayer(esriLayer);
          console.log("Switched to satellite view");
        }
      } else {
        if (!map.hasLayer(osmLayer)) {
          map.removeLayer(esriLayer);
          map.addLayer(osmLayer);
          console.log("Switched back to OSM");
        }
      }
    });

    // هندل کردن رویداد کشیدن
    map.on(L.Draw.Event.CREATED, function (event) {
      var layer = event.layer;
      drawnItems.addLayer(layer);

      var latlngs = layer.getLatLngs()[0];
      var coords = latlngs.map(function(latlng) {
          return [parseFloat(latlng.lat.toFixed(6)), parseFloat(latlng.lng.toFixed(6))];
      });

      // بستن پلی‌گون
      if (coords.length > 0 && (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1])) {
          coords.push(coords[0]);
      }

      console.log("Selected coordinates:", coords);

      fetch("http://soheil:8000/api/v1/app/submit-bbox/2", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(coords)
      })
      .then(res => res.json())
      .then(data => console.log("Server response:", data))
      .catch(err => console.error("Error sending data:", err));
    });
  </script>
</body>
</html>
